name: Backend release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: release_test
          POSTGRES_PASSWORD: release_test
          POSTGRES_DB: hercules_release_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U release_test -d hercules_release_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://release_test:release_test@127.0.0.1:5432/hercules_release_test
      JWT_SECRET: isolated-ci-only-secret-not-for-deployment
      JOTFORM_ENABLED: 'false'
      PUSH_NOTIFICATIONS_ENABLED: 'false'
      RELEASE_TEST_DATABASE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand --watchman=false
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:deploy
      - run: npm run test:e2e -- --runInBand --watchman=false
